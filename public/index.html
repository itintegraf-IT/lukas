<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOBR — řídicí panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --press:#15171b; --panel:#1c1f25; --line:#2b2f38;
    --paper:#f2f0ec; --muted:#8b929c;
    --c:#009fe3; --m:#e6007e; --y:#ffd500; --k:#0c0d10;
    --mono:"Space Mono", ui-monospace, "SFMono-Regular", "Cascadia Code", monospace;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--press); color:var(--paper);
    font:15px/1.5 var(--sans);
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  /* soutiskové značky v rozích – tiskařský podpis */
  .crop{position:fixed; width:20px; height:20px; pointer-events:none; opacity:.5}
  .crop::before,.crop::after{content:""; position:absolute; background:var(--muted)}
  .crop::before{width:100%; height:1px; top:9px} .crop::after{height:100%; width:1px; left:9px}
  .crop.tl{top:18px; left:18px} .crop.tr{top:18px; right:18px}
  .crop.bl{bottom:18px; left:18px} .crop.br{bottom:18px; right:18px}

  .brand{display:flex; align-items:center; gap:12px; margin-bottom:26px}
  .logo{display:block; height:auto; flex:0 0 auto}
  .logo-sm{width:34px}
  .brand--stack{flex-direction:column; gap:12px; text-align:center}
  .brand--stack .logo{width:300px;max-width:88%}
  .brand .wm{font:700 15px/1 var(--mono); letter-spacing:.34em; text-transform:uppercase}
  .brand .sub{color:var(--muted); font:400 10.5px/1.3 var(--mono); letter-spacing:.06em; margin-top:4px}

  .screen{display:none; width:100%}
  .screen.on{display:block}

  /* ---------- přihlášení ---------- */
  #login{max-width:340px; margin:0 auto}
  #login .card{background:var(--panel); border:1px solid var(--line); padding:26px 24px 24px}
  .field{margin-bottom:14px}
  .field label{display:block; font:700 10px/1 var(--mono); letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .field input{width:100%; background:#101216; border:1px solid var(--line); color:var(--paper);
    padding:11px 12px; font:15px/1 var(--sans); border-radius:0}
  .field input:focus{outline:none; border-color:var(--c)}
  .btn{width:100%; margin-top:6px; background:var(--paper); color:#101216; border:0;
    padding:12px; font:700 12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; cursor:pointer}
  .btn:hover{background:#fff}
  .btn:disabled{opacity:.5; cursor:default}
  .err{min-height:18px; margin-top:12px; color:#ff6b6b; font-size:13px}

  /* ---------- menu ---------- */
  #menu{max-width:920px; margin:0 auto}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px}
  .who{color:var(--muted); font:400 12px/1.4 var(--mono)}
  .who b{color:var(--paper); font-weight:700}
  .logout{background:none; border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; font:700 10px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; cursor:pointer}
  .logout:hover{color:var(--paper); border-color:var(--muted)}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
  @media(max-width:640px){ .grid{grid-template-columns:1fr} }
  .tile{display:flex; gap:16px; align-items:center; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); padding:16px;
    transition:border-color .15s, transform .15s}
  .tile:hover{border-color:var(--chan); transform:translateY(-2px)}
  .tile:focus-visible{outline:2px solid var(--chan); outline-offset:2px}
  .swatch{width:66px; height:66px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:var(--chan); color:var(--ink,#fff); font:700 30px/1 var(--mono)}
  .swatch.kk{border:1px solid #555} /* černý kanál ať je vidět na tmavém */
  .tile .nm{font:700 16px/1.2 var(--sans); letter-spacing:.01em}
  .tile .ds{color:var(--muted); font-size:13px; margin-top:3px}
  .tile .rl{margin-top:7px; display:inline-block; font:700 9px/1 var(--mono);
    letter-spacing:.16em; text-transform:uppercase; padding:4px 7px; border:1px solid var(--line); color:var(--muted)}
  .tile .rl.edit{color:var(--chan); border-color:var(--chan)}
  .empty{color:var(--muted); text-align:center; padding:40px 0; font-size:14px}

  @media(prefers-reduced-motion:reduce){ .tile{transition:none} .tile:hover{transform:none} }
</style>
</head>
<body>
  <span class="crop tl"></span><span class="crop tr"></span>
  <span class="crop bl"></span><span class="crop br"></span>

  <!-- PŘIHLÁŠENÍ -->
  <section id="login" class="screen">
    <div class="brand brand--stack">
      <img class="logo" src="logo.png" alt="BOBR — Board for Operations, Benchmarks and Roster">
      <div class="sub">Board for Operations, Benchmarks and Roster</div>
    </div>
    <div class="card">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="pass">Heslo</label>
        <input id="pass" type="password" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn">Přihlásit se</button>
      <div class="err" id="loginErr"></div>
    </div>
  </section>

  <!-- VYNUCENÁ ZMĚNA HESLA -->
  <section id="changepw" class="screen">
    <div class="brand brand--stack">
      <img class="logo" src="logo.png" alt="BOBR">
      <div class="sub">Nastav si nové heslo</div>
    </div>
    <div class="card" style="max-width:340px;margin:0 auto">
      <div class="field">
        <label for="np1">Nové heslo</label>
        <input id="np1" type="password" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="np2">Nové heslo znovu</label>
        <input id="np2" type="password" autocomplete="new-password">
      </div>
      <button class="btn" id="cpBtn">Uložit a pokračovat</button>
      <div class="err" id="cpErr"></div>
    </div>
  </section>

  <!-- MENU APLIKACÍ -->
  <section id="menu" class="screen">
    <div class="topbar">
      <div class="brand" style="margin:0">
        <img class="logo logo-sm" src="logo.png" alt="BOBR">
        <div><div class="wm">BOBR</div><div class="sub">řídicí panel</div></div>
      </div>
      <div style="display:flex; align-items:center; gap:14px">
        <span class="who" id="who"></span>
        <button class="logout" id="logoutBtn">Odhlásit</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

<script src="api.js"></script>
<script>
  /* Seznam aplikací. Novou přidáš jedním řádkem sem + řádkem do tabulky permissions.
     ch = kanál CMYK, color = barva kanálu, ink = barva písmena ve swatchi. */
  const APPS = [
    { key:"kpi",          ch:"C", color:"var(--c)", ink:"#fff",     name:"KPI",            sub:"ukazatele výroby",     url:"kpi.html" },
    { key:"produktivita", ch:"M", color:"var(--m)", ink:"#fff",     name:"Produktivita",   sub:"produktivita strojů",  url:"produktivita.html" },
    { key:"smeny",        ch:"Y", color:"var(--y)", ink:"#101216",  name:"Obsazení směn",  sub:"plánování a pokrytí",  url:"smeny.html" },
    { key:"stroje",       ch:"K", color:"var(--k)", ink:"#fff",     name:"Tiskové stroje", sub:"analýza a přehledy",   url:"stroje.html", kk:true },
  ];

  const $ = s => document.querySelector(s);
  const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));

  async function boot(){
    _me = null;                       // vždy čerstvý stav (kvůli must_change_pw)
    const me = await getMe();
    if(!me){ show("login"); $("#email").focus(); return; }
    if(me.must_change_pw){ show("changepw"); $("#np1").focus(); return; }
    renderMenu(me); show("menu");
  }

  async function changePw(){
    const a = $("#np1").value, b = $("#np2").value;
    $("#cpErr").textContent = "";
    if(a.length < 4){ $("#cpErr").textContent = "Heslo musí mít aspoň 4 znaky."; return; }
    if(a !== b){ $("#cpErr").textContent = "Hesla se neshodují."; return; }
    $("#cpBtn").disabled = true;
    const r = await fetch("/api/change-password", { method:"POST", credentials:"include",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({ new_password:a }) });
    $("#cpBtn").disabled = false;
    if(!r.ok){ $("#cpErr").textContent = "Změna se nezdařila, zkus to znovu."; return; }
    $("#np1").value = ""; $("#np2").value = "";
    boot();
  }

  async function login(){
    const email = $("#email").value.trim();
    const password = $("#pass").value;
    $("#loginErr").textContent = "";
    $("#loginBtn").disabled = true;
    const ok = await apiLogin(email, password);
    $("#loginBtn").disabled = false;
    if(!ok){ $("#loginErr").textContent = "Přihlášení se nezdařilo. Zkontroluj e-mail a heslo."; return; }
    boot();
  }

  function renderMenu(me){
    $("#who").innerHTML = "Přihlášen: <b>" + (me.email || "") + "</b>";
    const roleBy = Object.fromEntries((me.permissions || []).map(p => [p.app_key, p.role]));
    const isAdmin = !!me.is_admin;
    const visible = isAdmin ? APPS : APPS.filter(a => roleBy[a.key]);
    const grid = $("#grid");
    if(!visible.length && !isAdmin){ grid.innerHTML = '<div class="empty">Zatím nemáš přístup k žádné aplikaci. Požádej správce o přidělení práv.</div>'; return; }
    grid.innerHTML = visible.map(a => {
      const role = isAdmin ? "edit" : roleBy[a.key];
      const rl = isAdmin ? "admin" : (role === "edit" ? "editace" : "náhled");
      return `<a class="tile" href="${a.url}" style="--chan:${a.color};--ink:${a.ink}">
        <div class="swatch${a.kk?' kk':''}">${a.ch}</div>
        <div>
          <div class="nm">${a.name}</div>
          <div class="ds">${a.sub}</div>
          <span class="rl ${role}">${rl}</span>
        </div>
      </a>`;
    }).join("");

    if(me.is_admin){
      grid.innerHTML += `<a class="tile" href="admin.html" style="--chan:#8b929c;--ink:#101216">
        <div class="swatch" style="background:#8b929c">⚙</div>
        <div>
          <div class="nm">Správa uživatelů</div>
          <div class="ds">účty a přístupová práva</div>
          <span class="rl edit" style="--chan:#8b929c">admin</span>
        </div>
      </a>`;
    }
  }

  $("#loginBtn").onclick = login;
  $("#pass").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
  $("#email").addEventListener("keydown", e => { if(e.key === "Enter") $("#pass").focus(); });
  $("#logoutBtn").onclick = () => signOut();
  $("#cpBtn").onclick = changePw;
  $("#np2").addEventListener("keydown", e => { if(e.key === "Enter") changePw(); });
  $("#np1").addEventListener("keydown", e => { if(e.key === "Enter") $("#np2").focus(); });

  boot();
</script>
</body>
</html>
